<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תקציב חודשי — וינטר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="auth.js"></script>
<style>
:root{--bg:#0a0a0a;--s:#1a1a1a;--e:#242424;--t:#f0efe8;--m:#888;--ac:#ff6b35;--aa:#f7931e;--bo:#2e2e2e;--g:#4ade80;--r:#f87171;--b:#60a5fa;--p:#a78bfa;--y:#facc15;--rad:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Space Grotesk',-apple-system,sans-serif;color:var(--t);padding-bottom:60px}
nav{background:var(--s);border-bottom:1px solid var(--bo);padding:0 20px;display:flex;align-items:center;position:sticky;top:0;z-index:10}
.nb{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--ac);padding:12px 18px 12px 0;border-left:1px solid var(--bo);margin-left:16px}
.nl{padding:15px 12px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--m);text-decoration:none;letter-spacing:1px;border-bottom:2px solid transparent;transition:all .15s}
.nl:hover{color:var(--t)}.nl.act{color:var(--ac);border-bottom-color:var(--ac)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

.hero{background:var(--s);border-bottom:1px solid var(--bo);padding:28px 20px 22px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 50% 35% at 50% 0%,rgba(74,222,128,0.07),transparent 70%);pointer-events:none}
.hero-eye{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:3px;color:var(--g);text-transform:uppercase;margin-bottom:6px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,7vw,3.5rem);letter-spacing:5px;line-height:1;margin-bottom:4px}
.hero h1 span{color:var(--ac)}
.hero-sub{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--m);letter-spacing:1px}
.kpis{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:18px}
.kpi{text-align:center}
.kv{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;line-height:1}
.kv.g{color:var(--g)}.kv.r{color:var(--r)}.kv.a{color:var(--aa)}.kv.b{color:var(--b)}.kv.y{color:var(--y)}
.kl{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--m);letter-spacing:1px;margin-top:2px}

.sh{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sh h2{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:3px;white-space:nowrap}
.sl{flex:1;height:1px;background:var(--bo)}
.sb{font-size:.62rem;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border-radius:3px;font-weight:700;white-space:nowrap}
.sb.g{background:rgba(74,222,128,.12);color:var(--g);border:1px solid rgba(74,222,128,.25)}
.sb.r{background:rgba(248,113,113,.12);color:var(--r);border:1px solid rgba(248,113,113,.25)}
.sb.a{background:rgba(247,147,30,.12);color:var(--aa);border:1px solid rgba(247,147,30,.25)}
.sb.b{background:rgba(96,165,250,.12);color:var(--b);border:1px solid rgba(96,165,250,.25)}

/* WATERFALL */
.wf{background:var(--s);border:1px solid var(--bo);border-radius:var(--rad);overflow:hidden;margin-bottom:10px}
.wfr{display:flex;align-items:stretch;border-bottom:1px solid var(--bo)}
.wfr:last-child{border:none}
.wfr.tot{background:rgba(74,222,128,.05);border-top:1px solid rgba(74,222,128,.2)}
.wfl{padding:10px 14px;flex:1}
.wfn{font-size:.88rem;font-weight:500}
.wfs{font-size:.69rem;color:var(--m);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.wfr-right{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-width:130px}
.wfa{font-family:'IBM Plex Mono',monospace;font-size:.86rem;font-weight:500}
.wfa.r{color:var(--r)}.wfa.g{color:var(--g)}.wfa.a{color:var(--aa)}.wfa.b{color:var(--b)}.wfa.y{color:var(--y)}
.wfpct{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--m);margin-top:2px}
.wfrem{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--m);margin-top:1px}
.wfbar{width:3px;flex-shrink:0;align-self:stretch}

/* LAYERS */
.layers{display:flex;flex-direction:column;gap:8px}
.layer{background:var(--s);border:1px solid var(--bo);border-radius:var(--rad);overflow:hidden}
.lh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .12s;user-select:none}
.lh:hover,.lh.open{background:var(--e)}
.lnum{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;min-width:20px;line-height:1}
.lname{flex:1;font-size:.88rem;font-weight:500}
.lpct{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--m);margin-left:4px}
.ltot{font-family:'IBM Plex Mono',monospace;font-size:.86rem;font-weight:500}
.lrem{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--m);margin-left:6px}
.lchev{font-size:.65rem;color:var(--m);transition:transform .2s;min-width:14px;text-align:center}
.lchev.open{transform:rotate(180deg)}
.lb{display:none;padding:2px 14px 12px 42px;border-top:1px solid var(--bo)}
.lb.open{display:block}
.li{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:.5px solid var(--bo);font-size:.82rem;gap:8px}
.li:last-child{border:none}
.lin{color:var(--m);flex:1;line-height:1.4}
.lin.prot{color:var(--p)}
.lin.new{color:var(--g)}
.lin.cancel{color:var(--r);text-decoration:line-through}
.lia{display:flex;gap:10px;align-items:center;flex-shrink:0}
.liamt{font-family:'IBM Plex Mono',monospace;font-size:.8rem}
.liamt.r{color:var(--r)}.liamt.g{color:var(--g)}.liamt.a{color:var(--aa)}.liamt.p{color:var(--p)}.liamt.b{color:var(--b)}.liamt.y{color:var(--y)}
.lipct{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--m);min-width:38px;text-align:left}

/* DONUT */
.chart-wrap{height:220px;position:relative}

/* HABITS */
.habit{background:var(--s);border:1px solid var(--bo);border-radius:var(--rad);padding:14px 16px;display:flex;gap:14px;margin-bottom:8px}
.hnum{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;color:var(--ac);opacity:.35;line-height:1;min-width:28px}
.hbody{}
.htitle{font-size:.9rem;font-weight:600;margin-bottom:3px}
.hdesc{font-size:.8rem;color:var(--m);line-height:1.6}
.htag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.6rem;padding:2px 7px;border-radius:3px;margin-top:5px}
.htag.g{background:rgba(74,222,128,.1);color:var(--g);border:1px solid rgba(74,222,128,.2)}
.htag.a{background:rgba(247,147,30,.1);color:var(--aa);border:1px solid rgba(247,147,30,.2)}

/* MILESTONES */
.ms{background:var(--s);border:1px solid var(--bo);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:7px}
.msdate{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--m);min-width:76px}
.msname{font-size:.86rem;font-weight:500;flex:1}
.msamt{font-family:'IBM Plex Mono',monospace;font-size:.8rem}

/* SUMMARY TABLE */
.stbl{width:100%;border-collapse:collapse}
.stbl th{font-family:'IBM Plex Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--m);text-align:right;padding:7px 10px;border-bottom:1px solid var(--bo)}
.stbl td{text-align:right;padding:8px 10px;border-bottom:.5px solid var(--bo);font-size:.82rem}
.stbl td:first-child{text-align:right;color:var(--m)}
.stbl tr:last-child td{border:none}
.stbl tr:hover td{background:var(--e)}
.pct-bar{height:4px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:6px}


/* MONTH PICKER + MONTH VIEW */
.picker{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
.picker label{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:1px;color:var(--m)}
.picker select{flex:1;background:var(--s);color:var(--t);border:1px solid var(--bo);border-radius:8px;padding:10px 12px;font:inherit;font-size:.9rem}
.picker select:focus{outline:2px solid var(--ac);outline-offset:1px}
.mkpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:560px){.mkpis{grid-template-columns:repeat(4,1fr)}}
.mk{background:var(--s);border:1px solid var(--bo);border-radius:var(--rad);padding:12px;text-align:right}
.mk .v{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:1px;line-height:1.1}
.mk .v,.mtbl td.n{direction:ltr;text-align:right}
.mk .l{font-size:.68rem;color:var(--m);margin-top:3px}
.mnote{font-size:.74rem;color:var(--m);line-height:1.5;margin:6px 0 2px}
.mcard{background:var(--s);border:1px solid var(--bo);border-radius:var(--rad);overflow:hidden;margin-bottom:6px}
.mtbl{width:100%;border-collapse:collapse}
.mtbl th{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:1px;color:var(--m);text-align:right;padding:7px 10px;border-bottom:1px solid var(--bo);font-weight:400}
.mtbl td{text-align:right;padding:8px 10px;border-bottom:.5px solid var(--bo);font-size:.8rem}
.mtbl tr:last-child td{border:none}
.mtbl td.n{font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.dpos{color:var(--g)}.dneg{color:var(--r)}.dmut{color:var(--m)}
.mbar{height:4px;border-radius:2px;background:var(--ac);opacity:.55;display:block;margin-top:4px}

@media(max-width:500px){.kpis{gap:14px}.wfr-right{min-width:100px}}
</style>
<script>
(function(){
  fetch("https://script.google.com/macros/s/AKfycbyRXr2Bk6uhUoo_WaWg0YY0KiLPK_7r0wFBuQcM-EghFmqnkFpztTvCRj-Y2i2AQrlEQA/exec"+"?key="+(sessionStorage.getItem("wf_pass")||""))
    .then(r=>r.text())
    .then(js=>{try{wfRunData(js);document.dispatchEvent(new Event('dataReady'));}catch(e){console.error(e);}}); 
})();
</script>
</head>
<body>
<nav>
  <span class="nb">כספים</span>
  <a href="index.html" class="nl">דאשבורד</a>
  <a href="overdraft.html" class="nl">יציאה ממינוס</a>
  <a href="budget.html" class="nl">תקציב</a>
  <a href="budget-monthly.html" class="nl act">חודשי</a>
</nav>

<div class="hero">
  <div class="hero-eye" id="heroEye">תקציב חודשי</div>
  <h1>כסף <span>בסדר</span></h1>
  <div class="hero-sub" id="heroSub">תקציב מול חודש בפועל</div>
  <div class="kpis" id="heroKpis"></div>
</div>

<div class="wrap">

<!-- MONTH PICKER -->
<div class="picker">
  <label for="monthSel">תצוגה</label>
  <select id="monthSel" aria-label="בחירת חודש"></select>
</div>
<div id="monthView" hidden></div>

<div id="budgetView">
<!-- WATERFALL -->
<div class="sh"><h2>תזרים שכבה אחר שכבה</h2><div class="sl"></div></div>
<div class="wf" id="wfContainer"></div>

<!-- LAYERS ACCORDION -->
<div class="sh" style="margin-top:20px"><h2>פירוט מלא</h2><div class="sl"></div><span class="sb a">לחץ לפתוח</span></div>
<div class="layers" id="layersContainer"></div>

<!-- DONUT -->
<div class="sh" style="margin-top:20px"><h2>איפה הולך הכסף</h2><div class="sl"></div></div>
<div style="background:var(--s);border:1px solid var(--bo);border-radius:var(--rad);padding:16px">
  <div class="chart-wrap"><canvas id="donut" role="img" aria-label="פילוח תקציב חודשי"></canvas></div>
</div>

<!-- SUMMARY TABLE WITH % -->
<div class="sh" style="margin-top:20px"><h2>טבלת סיכום עם אחוזים</h2><div class="sl"></div></div>
<div style="background:var(--s);border:1px solid var(--bo);border-radius:var(--rad);overflow:hidden">
  <table class="stbl">
    <thead><tr><th>קטגוריה</th><th>סכום</th><th>% מהכנסה</th><th>בר</th></tr></thead>
    <tbody id="summaryTable"></tbody>
  </table>
</div>

<!-- ATOMIC HABITS -->
<div class="sh" style="margin-top:20px"><h2>5 הרגלים שמחזיקים את זה</h2><div class="sl"></div></div>
<div id="habitsContainer"></div>

<!-- MILESTONES -->
<div class="sh" style="margin-top:20px"><h2>אבני דרך</h2><div class="sl"></div></div>
<div id="milestonesContainer"></div>
</div><!-- /budgetView -->

</div>

<script>
document.addEventListener('dataReady', function() {

const BA = DATA.budget_amounts;
const INCOME = BA.income;
const fmt = n => '₪' + Math.round(n).toLocaleString('he-IL');
const pct = (n, d) => d ? (n / d * 100).toFixed(1) + '%' : '—';
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum = (...ks) => ks.reduce((a, k) => a + (BA[k] || 0), 0);

// ── BUDGET NUMBERS: all from the data file, nothing typed in here ──
const T = {
  loans:   sum('mortgage','loan1','loan2','loan3','loan4','loan_kh'),
  fixed:   sum('arnona','health_kupat','vaad_bayit','chashmal_pazgaz','maim','netflix','spotify','apple','google','claude','pango','car_insurance_libra','life_insurance_migdal','eretz_derech','gilat_internet','vaad_katya_work','oscar_winter'),
  kids:    sum('emma_ballet','emma_aftercare','maya_5fingers','sofia_tfirah','scouts','school'),
  variable:sum('groceries','fuel','clothing','restaurants','pharmacy','gym_katya','gym_chris','misc','aliexpress','ravpass'),
  savings: sum('saving_europe','saving_asia','saving_pension','saving_bltm'),
};
const remainByName = {};
(DATA.layers || []).forEach(l => { remainByName[l.name] = l.remain; });
const rem = name => remainByName[name] != null ? remainByName[name] : 0;

// ── HERO ──
const HEB_FULL = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const upd = (DATA.meta && DATA.meta.updated) ? new Date(DATA.meta.updated) : null;
document.getElementById('heroEye').textContent = 'תקציב חודשי' + (upd && !isNaN(upd) ? ' — עודכן ' + HEB_FULL[upd.getMonth()] + ' ' + upd.getFullYear() : '');
const asia = (DATA.savings_plan || []).find(x => /אסיה/.test(x.name));
document.getElementById('heroKpis').innerHTML = [
  ['g', fmt(INCOME), 'הכנסה בתקציב'],
  ['r', fmt(BA.expenses), 'סה"כ הוצאות בתקציב'],
  ['g', fmt(BA.surplus), 'עודף בתקציב'],
  ['b', fmt(BA.saving_europe + BA.saving_asia), 'חיסכון טיולים'],
  ['y', asia ? asia.date : '—', 'אסיה'],
].map(k => `<div class="kpi"><div class="kv ${k[0]}">${k[1]}</div><div class="kl">${k[2]}</div></div>`).join('');

// ── WATERFALL ──
const wfData = [
  {name:'הכנסה', sub:'קטיה + כריס + קצבת ילדים', amt:INCOME, rem:INCOME, color:'var(--g)', sign:'+'},
  {name:'משכנתא + הלוואות', sub:'משכנתא, ארבע הלוואות והלוואת קרן ההשתלמות', amt:T.loans, rem:rem('משכנתא + הלוואות'), color:'var(--r)', sign:'-'},
  {name:'קבועים', sub:'ארנונה, מכבי, ועד בית, חשמל, מים, גילת, ביטוח, פנגו...', amt:T.fixed, rem:rem('קבועים'), color:'var(--aa)', sign:'-'},
  {name:'ילדים', sub:'בלט, צהרון, ספורט, צופות, בית ספר — מוגן לחלוטין', amt:T.kids, rem:rem('ילדים'), color:'var(--p)', sign:'-'},
  {name:'הוצאות משתנה', sub:'מכולת, דלק, ביגוד, מסעדות, בריאות ושאר', amt:T.variable, rem:rem('משתנה'), color:'var(--b)', sign:'-'},
  {name:'חיסכון', sub:'אירופה, אסיה, פנסיה עצמאית וקרן בלת"מ', amt:T.savings, rem:rem('חיסכון'), color:'var(--b)', sign:'-'},
  {name:'עודף חודשי', sub:'בונוסים קטיה + קצבת ילדים → הלוואה. שאר = גמיש.', amt:BA.surplus, rem:BA.surplus, color:'var(--g)', sign:'+', total:true},
];
const wfc = document.getElementById('wfContainer');
wfData.forEach(r => {
  wfc.innerHTML += `<div class="wfr${r.total?' tot':''}">
    <div class="wfbar" style="background:${r.color}"></div>
    <div class="wfl"><div class="wfn">${r.name}</div><div class="wfs">${r.sub}</div></div>
    <div class="wfr-right">
      <div class="wfa" style="color:${r.color}">${r.sign}${fmt(r.amt)}</div>
      <div class="wfpct">${pct(r.amt, INCOME)} מהכנסה</div>
      ${!r.total?`<div class="wfrem">נשאר ${fmt(r.rem)}</div>`:''}
    </div>
  </div>`;
});

// ── LAYERS (items come from budget_amounts) ──
const it = (name, key, cls, extra) => Object.assign({name, amt: BA[key] || 0, cls: cls || 'b'}, extra || {});
const layers = [
  { num:'1', name:'משכנתא + הלוואות', color:'var(--r)', total:T.loans, remain:rem('משכנתא + הלוואות'),
    items:[ it('משכנתא (פועלים)','mortgage','r'), it('הלוואה 1','loan1','r'), it('הלוואה 2','loan2','r'), it('הלוואה 3','loan3','r'), it('הלוואה 4','loan4','r'),
            it('הלוואת קרן השתלמות (7 שנים, 4%)','loan_kh','a') ]},
  { num:'2', name:'קבועים', color:'var(--aa)', total:T.fixed, remain:rem('קבועים'),
    items:[ it('ארנונה','arnona','r'), it('מכבי','health_kupat','r'), it('ועד בית','vaad_bayit','r'), it('חשמל + גז (פזגז)','chashmal_pazgaz','r'), it('מים','maim','r'),
            it('נטפליקס','netflix','r'), it('ספוטיפיי','spotify','r'), it('Apple','apple','r'), it('Google','google','r'), it('Claude','claude','r'), it('פנגו','pango','r'),
            it('ביטוח רכב','car_insurance_libra','aa'), it('ביטוח חיים (מגדל)','life_insurance_migdal','r'), it('ארץ דרך','eretz_derech','r'),
            it('אינטרנט (גילת)','gilat_internet','r'), it('ועד עובדי קטיה','vaad_katya_work','r'), it('הוראת קבע (אוסקר)','oscar_winter','r') ]},
  { num:'3', name:'ילדים — מוגן', color:'var(--p)', total:T.kids, remain:rem('ילדים'),
    items:[ it('אמה — בלט Donna','emma_ballet','p',{prot:true}), it('אמה — צהרון אלתרמן','emma_aftercare','p',{prot:true}), it('מאיה — 5 Fingers','maya_5fingers','p',{prot:true}),
            it('סופיה — תפירה','sofia_tfirah','p',{prot:true, note:'ישתנה שנה הבאה'}), it('צופות','scouts','p',{prot:true}), it('בית ספר','school','p',{prot:true}) ]},
  { num:'4', name:'הוצאות משתנה', color:'var(--b)', total:T.variable, remain:rem('משתנה'),
    items:[ it('מכולת','groceries'), it('דלק','fuel'), it('ביגוד','clothing'), it('מסעדות/קפה','restaurants'), it('תרופות','pharmacy'),
            it('גים קטיה','gym_katya'), it('גים כריס','gym_chris'), it('שונות','misc'), it('AliExpress','aliexpress'), it('רב-פס','ravpass') ]},
  { num:'5', name:'חיסכון', color:'var(--b)', total:T.savings, remain:rem('חיסכון'),
    items:[ it('פקדון אירופה','saving_europe','b'), it('פקדון אסיה','saving_asia','b'), it('פנסיה עצמאית','saving_pension','g'), it('קרן בלת"מ','saving_bltm','a') ]},
];
const lc = document.getElementById('layersContainer');
layers.forEach((l, i) => {
  const div = document.createElement('div');
  div.className = 'layer';
  const itemsHTML = l.items.filter(x => x.amt > 0).map(x => `<div class="li">
      <span class="lin ${x.prot?'prot':''}">${x.prot?'🔒 ':''}${esc(x.name)}${x.note?` <span style="font-size:.65rem;opacity:.6">(${esc(x.note)})</span>`:''}</span>
      <div class="lia"><span class="liamt ${x.cls}">${fmt(x.amt)}</span><span class="lipct">${pct(x.amt, INCOME)}</span></div>
    </div>`).join('');
  div.innerHTML = `
    <div class="lh" id="lh${i}" onclick="tog(${i})">
      <span class="lnum" style="color:${l.color}">${l.num}</span>
      <span class="lname">${l.name}</span>
      <span class="lpct">${pct(l.total, INCOME)}</span>
      <span class="ltot" style="color:${l.color}">${fmt(l.total)}</span>
      <span class="lrem">נשאר ${fmt(l.remain)}</span>
      <span class="lchev" id="ch${i}">▾</span>
    </div>
    <div class="lb" id="lb${i}">${itemsHTML}</div>`;
  lc.appendChild(div);
});
window.tog = function(i) {
  const lb = document.getElementById('lb'+i), lh = document.getElementById('lh'+i), ch = document.getElementById('ch'+i);
  const o = lb.classList.contains('open');
  document.querySelectorAll('.lb').forEach(x => x.classList.remove('open'));
  document.querySelectorAll('.lh').forEach(x => x.classList.remove('open'));
  document.querySelectorAll('.lchev').forEach(x => x.classList.remove('open'));
  if (!o) { lb.classList.add('open'); lh.classList.add('open'); ch.classList.add('open'); }
};

// ── DONUT + SUMMARY ──
const slices = [
  {name:'משכנתא + הלוואות', amt:T.loans, color:'#f87171'},
  {name:'קבועים', amt:T.fixed, color:'#f97316'},
  {name:'ילדים (מוגן)', amt:T.kids, color:'#a78bfa'},
  {name:'מכולת', amt:BA.groceries, color:'#4ade80'},
  {name:'דלק', amt:BA.fuel, color:'#fbbf24'},
  {name:'ביגוד', amt:BA.clothing, color:'#fb923c'},
  {name:'מסעדות/קפה', amt:BA.restaurants, color:'#f472b6'},
  {name:'בריאות + גים', amt:sum('pharmacy','gym_katya','gym_chris'), color:'#34d399'},
  {name:'שונות', amt:sum('misc','aliexpress','ravpass'), color:'#6b7280'},
  {name:'חיסכון', amt:T.savings, color:'#60a5fa'},
  {name:'עודף', amt:BA.surplus, color:'#22c55e'},
];
new Chart(document.getElementById('donut'), {
  type:'doughnut',
  data:{ labels:slices.map(x => x.name), datasets:[{ data:slices.map(x => x.amt), backgroundColor:slices.map(x => x.color), borderWidth:0, hoverOffset:6 }] },
  options:{responsive:true, maintainAspectRatio:false, cutout:'62%',
    plugins:{legend:{display:true, position:'bottom', labels:{color:'#888', font:{size:10}, boxWidth:10, padding:8}},
    tooltip:{callbacks:{label:c => ` ${c.label}: ${fmt(c.raw)} (${pct(c.raw, INCOME)})`}}}}
});
const tb = document.getElementById('summaryTable');
slices.forEach(r => {
  tb.innerHTML += `<tr><td>${r.name}</td><td style="font-family:'IBM Plex Mono',monospace">${fmt(r.amt)}</td>
    <td style="font-family:'IBM Plex Mono',monospace;color:${r.color}">${pct(r.amt, INCOME)}</td>
    <td><span class="pct-bar" style="width:${Math.round(r.amt/INCOME*120)}px;background:${r.color}20;border:1px solid ${r.color}40"></span></td></tr>`;
});
tb.innerHTML += `<tr style="background:rgba(74,222,128,.05);border-top:1px solid rgba(74,222,128,.2)">
  <td style="font-weight:600;color:var(--t)">סה"כ הוצאות (כולל חיסכון)</td>
  <td style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--r)">${fmt(BA.expenses)}</td>
  <td style="font-family:'IBM Plex Mono',monospace;color:var(--r)">${pct(BA.expenses, INCOME)}</td><td></td></tr>
<tr style="background:rgba(74,222,128,.05)">
  <td style="font-weight:600;color:var(--g)">עודף</td>
  <td style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--g)">${fmt(BA.surplus)}</td>
  <td style="font-family:'IBM Plex Mono',monospace;color:var(--g)">${pct(BA.surplus, INCOME)}</td><td></td></tr>`;

// ── HABITS + MILESTONES (from the data file) ──
document.getElementById('habitsContainer').innerHTML = (DATA.atomic_habits || []).map(h => `<div class="habit">
    <div class="hnum">${esc(h.n)}</div>
    <div class="hbody"><div class="htitle">${esc(h.title)}</div><div class="hdesc">${esc(h.desc)}</div></div></div>`).join('');
const stColor = {todo:'var(--r)', saving:'var(--b)', future:'var(--g)'};
document.getElementById('milestonesContainer').innerHTML = (DATA.upcoming || []).map(m => `<div class="ms">
    <span class="msdate">${esc(m.date)}</span><span class="msname">${esc(m.name)}</span>
    <span class="msamt" style="color:${stColor[m.status] || 'var(--m)'}">${esc(m.status)}</span></div>`).join('');

// ── MONTH PICKER ──
const CAT = {groceries:'מכולת', restaurants:'מסעדות/קפה', fuel:'דלק', clothing:'ביגוד', entertainment:'פנאי ובידור', kids_activities:'פעילויות ילדים',
  health:'בריאות', utilities:'חשבונות', building_fee:'ועד בית', travel:'נסיעות', shopping:'קניות', savings:'חיסכון', other:'אחר', transfers:'העברות',
  loans:'הלוואות', mortgage:'משכנתא', cash:'מזומן', interest:'ריבית', insurance:'ביטוח', transport:'תחבורה', card_fee:'עמלות כרטיס', education:'חינוך', unclassified:'לא מסווג'};
const PROV = {americanExpress:'אמקס', cal:'כאל', max:'מקס', hapoalim:'בנק הפועלים (ישיר)', isracard:'ישראכרט'};
const CAT_BUDGET = {groceries:'groceries', fuel:'fuel', clothing:'clothing', restaurants:'restaurants'};
const MONTHS_HE = ['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];
const labelToKey = lab => { const m = /^(\S+)\s+(\d\d)$/.exec(lab); const i = m ? MONTHS_HE.indexOf(m[1]) : -1; return i < 0 ? null : '20' + m[2] + '-' + String(i + 1).padStart(2, '0'); };
const monthly = (DATA.monthly || []).map(m => Object.assign({key: labelToKey(m.label)}, m));
const detail = DATA.month_detail || {};

const sel = document.getElementById('monthSel');
sel.innerHTML = '<option value="">תקציב (תכנון)</option>' + monthly.slice().reverse().map(m =>
  `<option value="${esc(m.label)}">${esc(m.label)}${m.actual ? ' · בפועל' : ''}</option>`).join('');

function renderMonth(label) {
  const m = monthly.find(x => x.label === label);
  const box = document.getElementById('monthView');
  if (!m) { box.hidden = true; document.getElementById('budgetView').hidden = false; return; }
  const d = detail[m.key];
  const bal = m.balance, pos = bal >= 0, col = pos ? 'var(--g)' : 'var(--r)';
  const vsBudget = m.expenses - BA.expenses;
  let h = `<div class="sh" style="margin-top:14px"><h2>${esc(m.label)}</h2><div class="sl"></div></div>
  <div class="mkpis">
    <div class="mk"><div class="v" style="color:var(--g)">${fmt(m.income)}</div><div class="l">הכנסה${m.one_off_income ? ' (ללא חד-פעמי)' : ''}</div></div>
    <div class="mk"><div class="v" style="color:var(--r)">${fmt(m.expenses)}</div><div class="l">הוצאות</div></div>
    <div class="mk"><div class="v" style="color:${col}">${pos ? '+' : '−'}${fmt(Math.abs(bal))}</div><div class="l">מאזן · ${(m.balance_pct != null ? m.balance_pct : bal / m.income * 100).toFixed(1)}%</div></div>
    <div class="mk"><div class="v ${vsBudget > 0 ? 'dneg' : 'dpos'}">${vsBudget > 0 ? '+' : '−'}${fmt(Math.abs(vsBudget))}</div><div class="l">מול תקציב הוצאות ${fmt(BA.expenses)}</div></div>
  </div>`;
  if (m.note) h += `<div class="mnote">${esc(m.note)}</div>`;
  if (m.bonus) h += `<div class="mnote">🎁 בונוס${m.bonus_amt ? ' ' + fmt(m.bonus_amt) : ''}</div>`;
  if (m.abroad) h += `<div class="mnote">✈ נסיעה</div>`;
  if (m.one_off_income) h += `<div class="mnote">הכנסה חד-פעמית ${fmt(m.one_off_income)} — לא נספרת בהכנסה למעלה.</div>`;
  if (!d) {
    h += `<div class="mcard" style="padding:16px"><div class="dmut" style="font-size:.82rem;line-height:1.6">לחודש הזה יש רק נתוני סיכום (הכנסה, הוצאות, מאזן). פירוט לפי קטגוריות וחנויות קיים מיוני 2026, מהחיבור לבנקים ולכרטיסי האשראי.</div></div>`;
  } else {
    const total = Object.values(d.cats).reduce((a, v) => a + v, 0);
    h += `<div class="sh" style="margin-top:18px"><h2>לפי קטגוריה</h2><div class="sl"></div></div><div class="mcard"><table class="mtbl">
      <thead><tr><th>קטגוריה</th><th>סכום</th><th>% מההוצאות</th><th>מול תקציב</th></tr></thead><tbody>` +
      Object.entries(d.cats).map(([c, v]) => {
        const b = CAT_BUDGET[c] ? BA[CAT_BUDGET[c]] : null;
        const diff = b != null ? v - b : null;
        return `<tr><td>${esc(CAT[c] || c)}<span class="mbar" style="width:${Math.max(2, Math.round(v / total * 100))}%"></span></td>
          <td class="n">${fmt(v)}</td><td class="n dmut">${pct(v, total)}</td>
          <td class="n ${diff == null ? 'dmut' : diff > 0 ? 'dneg' : 'dpos'}">${diff == null ? '—' : (diff > 0 ? '+' : '−') + fmt(Math.abs(diff)) + ' (' + fmt(b) + ')'}</td></tr>`;
      }).join('') + `</tbody></table></div>`;
    h += `<div class="sh" style="margin-top:18px"><h2>לפי מקור</h2><div class="sl"></div></div><div class="mcard"><table class="mtbl"><tbody>` +
      Object.entries(d.providers).map(([p, v]) => `<tr><td>${esc(PROV[p] || p)}</td><td class="n">${fmt(v)}</td><td class="n dmut">${pct(v, total)}</td></tr>`).join('') +
      `</tbody></table></div>`;
    h += `<div class="sh" style="margin-top:18px"><h2>ההוצאות הגדולות</h2><div class="sl"></div></div><div class="mcard"><table class="mtbl"><tbody>` +
      d.top.map(t => `<tr><td>${esc(t.m)}<div class="dmut" style="font-size:.66rem">${esc(CAT[t.cat] || t.cat)}${t.n > 1 ? ' · ' + t.n + ' חיובים' : ''}</div></td><td class="n">${fmt(t.amt)}</td></tr>`).join('') +
      `</tbody></table></div>`;
    if (d.one_off && d.one_off.length) {
      h += `<div class="sh" style="margin-top:18px"><h2>הכנסות חד-פעמיות</h2><div class="sl"></div></div><div class="mcard"><table class="mtbl"><tbody>` +
        d.one_off.map(o => `<tr><td>${esc(o[0])}</td><td class="n dpos">${fmt(o[1])}</td></tr>`).join('') + `</tbody></table></div>`;
    }
  }
  box.innerHTML = h;
  box.hidden = false;
  document.getElementById('budgetView').hidden = true;
}
sel.addEventListener('change', () => { renderMonth(sel.value); try { history.replaceState(null, '', sel.value ? '#' + encodeURIComponent(sel.value) : location.pathname + location.search); } catch (e) {} });
const hash = decodeURIComponent((location.hash || '').slice(1));
if (hash && monthly.some(x => x.label === hash)) { sel.value = hash; renderMonth(hash); }

}); // end dataReady
</script>

</body>
</html>
