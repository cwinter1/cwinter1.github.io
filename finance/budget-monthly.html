<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תשלומים קבועים — מה משלמים בכל חודש</title>
<script src="auth.js"></script>
<link rel="stylesheet" href="wf.css">
<script src="wf.js"></script>
</head>
<body>
<nav id="wfnav"></nav>
<div class="page">
  <h1>תשלומים קבועים</h1>
  <div class="lead" id="lead"></div>
  <div class="grid g4" id="kpis"></div>
  <div id="groups"></div>

  <div class="sec" id="uSec" hidden><h2>חיובים שלא זוהו</h2><span class="hint">בחוגים, בית ספר ושיעורים. כדי שאסווג אותם נכון, צריך לדעת של מי הם ועל מה</span></div>
  <div class="card2 scroll-x" id="uBox" hidden><table class="tb" id="uTab"></table></div>

  <div class="sec" id="rSec" hidden><h2>יצא מהתקציב</h2><span class="hint">פריטים ישנים שהוסרו</span></div>
  <div class="card2" id="rBox" hidden></div>

  <div class="note" style="margin-top:18px" id="notes"></div>
</div>

<script>
WF.nav('budget-monthly.html');
WF.boot(function (D) {
  var R = D.recurring;
  if (!R || !R.items) { document.getElementById('lead').textContent = 'אין עדיין נתוני תשלומים קבועים.'; return; }
  var ms = R.months, cur = (D.live && D.live.month) || ms[ms.length - 1];
  var full = ms.filter(function (m) { return m !== cur; });
  var shown = ms.slice(-5);
  document.getElementById('lead').textContent = 'כל סעיף נבדק מול החיובים בפועל בבנק ובכרטיסים (' + WF.mShort(ms[0]) + ' עד ' + WF.mShort(ms[ms.length - 1]) + '). כך נראה מה באמת קבוע, מה השתנה ומה הפסיק.';
  var GROUPS = [['kids', 'ילדים וחוגים'], ['school', 'בית ספר ושיעורים'], ['home', 'בית וחשבונות'], ['insurance', 'ביטוחים'], ['health', 'בריאות']];

  function vals(it, list) { return list.map(function (m) { return it.m[m] || 0; }); }
  function nz(a) { return a.filter(function (x) { return x > 0; }); }
  // the current monthly rate: the latest charge (a bimonthly bill is halved); seasonal or irregular items use the average of the last four charges
  function rate(it) {
    var all = vals(it, ms), n = nz(all); if (!n.length) return 0;
    if (it.annual) return WF.sum(n) / 12;
    var r = it.variable ? WF.avg(n.slice(-4)) : n[n.length - 1];
    return r / (it.period || 1);
  }
  function status(it) {
    var all = vals(it, ms), n = nz(all);
    if (!n.length) return '<span class="tag">לא חויב</span>';
    if (it.annual) return '<span class="tag">שנתי: ' + WF.ilsText(WF.sum(n)) + '</span>';
    var lastIdx = all.map(function (x) { return x > 0; }).lastIndexOf(true);
    if (ms.length - 1 - lastIdx >= 2) return '<span class="tag warn">לא חויב מאז ' + WF.mShort(ms[lastIdx]) + '</span>';
    if (it.variable) return '<span class="tag">משתנה</span>';
    if (n.length < 2) return '<span class="tag warn">חדש</span>';
    var a = n[n.length - 1], p = n[n.length - 2];
    if (Math.abs(a - p) > p * 0.1) return '<span class="tag ' + (a < p ? 'ok' : 'warn') + '">' + (a < p ? 'ירד' : 'עלה') + ' מ-' + WF.ilsText(p) + '</span>';
    return '<span class="tag ok">יציב</span>';
  }

  var totals = {};
  var html = GROUPS.map(function (g) {
    var items = R.items.filter(function (i) { return i.group === g[0]; });
    if (!items.length) return '';
    var rows = '<tr><th>סעיף</th>' + shown.map(function (m) { return '<th class="n hs">' + WF.mShort(m) + '</th>'; }).join('') + '<th class="n">עכשיו בחודש</th><th>מצב</th></tr>';
    var tot = 0;
    items.forEach(function (it) {
      var a = rate(it), cells = shown.map(function (m) { return '<td class="n hs">' + (it.m[m] ? WF.ilsText(it.m[m]) : '<span style="color:var(--m)">—</span>') + '</td>'; }).join('');
      tot += a;
      rows += '<tr><td>' + WF.esc(it.name) + (it.owner ? ' <span class="tag">' + WF.esc(it.owner) + '</span>' : '') + (it.note ? '<div style="font-size:.76rem;color:var(--m);max-width:420px">' + WF.esc(it.note) + '</div>' : '') + '</td>' + cells + '<td class="n"><b>' + (a ? WF.ilsText(a) : '—') + '</b></td><td>' + status(it) + '</td></tr>';
    });
    totals[g[0]] = tot;
    return '<div class="sec"><h2>' + g[1] + '</h2><span class="hint">סך הכול בחודש ' + WF.ilsText(tot) + '</span></div><div class="card2 scroll-x"><table class="tb">' + rows + '</table></div>';
  }).join('');
  document.getElementById('groups').innerHTML = html;

  function k(t, v, sub) { return '<div class="kpi2"><div class="k">' + t + '</div><div class="v">' + v + '</div><div class="d">' + (sub || '') + '</div></div>'; }
  document.getElementById('kpis').innerHTML =
    k('ילדים וחוגים', WF.ilsText(totals.kids || 0), 'בחודש, בלי צופות') +
    k('בית ספר ושיעורים', WF.ilsText(totals.school || 0), 'בחודש') +
    k('בית וחשבונות', WF.ilsText(totals.home || 0), 'בחודש, כולל משכנתא והלוואות') +
    k('ביטוחים ובריאות', WF.ilsText((totals.insurance || 0) + (totals.health || 0)), 'בחודש');

  var U = R.unmatched || [];
  if (U.length) {
    document.getElementById('uSec').hidden = false; document.getElementById('uBox').hidden = false;
    document.getElementById('uTab').innerHTML = '<tr><th>חיוב</th>' + shown.map(function (m) { return '<th class="n hs">' + WF.mShort(m) + '</th>'; }).join('') + '<th class="n">סה"כ</th></tr>' +
      U.map(function (u) { return '<tr><td>' + WF.esc(u.name) + '<div style="font-size:.76rem;color:var(--m)">' + WF.name(u.cat) + '</div></td>' + shown.map(function (m) { return '<td class="n hs">' + (u.m[m] ? WF.ilsText(u.m[m]) : '—') + '</td>'; }).join('') + '<td class="n">' + WF.ilsText(WF.sum(Object.keys(u.m).map(function (x) { return u.m[x]; }))) + '</td></tr>'; }).join('');
  }
  var X = R.removed || [];
  if (X.length) {
    document.getElementById('rSec').hidden = false; document.getElementById('rBox').hidden = false;
    document.getElementById('rBox').innerHTML = '<table class="tb">' + X.map(function (x) { return '<tr><td><b>' + WF.esc(x.name) + '</b></td><td style="color:var(--m)">' + WF.esc(x.note) + '</td></tr>'; }).join('') + '</table>';
  }
  document.getElementById('notes').innerHTML = '<b>איך לקרוא:</b> "עכשיו בחודש" הוא החיוב האחרון של הסעיף. חשבון דו-חודשי (מים) מחולק ל-2, וסעיף משתנה (גז, חשמל, מכבי, ועד עובדים) הוא ממוצע ארבעת החיובים האחרונים. החודש הנוכחי עדיין לא נסגר, ולכן חלק מהחיובים הקבועים עוד לא יצאו. הנתונים מתעדכנים בכל ריצה.';
});
</script>
</body>
</html>
