<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תקציב — תוכנית מול מציאות</title>
<script src="auth.js"></script>
<link rel="stylesheet" href="wf.css">
<script src="wf.js"></script>
</head>
<body>
<nav id="wfnav"></nav>
<div class="page">
  <h1>תקציב: תוכנית מול מציאות</h1>
  <div class="lead" id="lead"></div>

  <div class="grid g4" id="kpis"></div>

  <div class="sec"><h2>כל קטגוריה</h2><span class="hint">ממוצע בפועל מול התקרות של התוכנית. לחיצה על שורה מציגה את העסקים הגדולים בה</span></div>
  <div class="card2 scroll-x"><table class="tb" id="tCat"></table></div>

  <div class="sec"><h2>מחוץ לתקציב השוטף</h2><span class="hint">מתוכננים ונכנסים לתחזית בנפרד</span></div>
  <div class="card2" id="out"></div>

  <div class="sec"><h2>כללי התוכנית</h2></div>
  <div class="card2"><ol id="rules" style="margin:0;padding-inline-start:20px;line-height:1.8"></ol></div>

  <div class="note" style="margin-top:18px" id="notes"></div>
</div>

<script>
WF.nav('budget.html');
WF.boot(function (D) {
  var P = D.od_plan || {}, base = P.base_months || [];
  var H = {}; WF.months().forEach(function (m) { H[m.m] = m; });
  var B = base.map(function (k) { return H[k]; }).filter(Boolean);
  if (!B.length) { document.getElementById('lead').textContent = 'אין עדיין נתונים לבסיס התקציב.'; return; }
  var live = D.live || {}, liveCats = live.cats || {}, det = D.month_detail || {};
  function avgCat(c) { return WF.avg(B.map(function (m) { return m.cats[c] || 0; })); }

  document.getElementById('lead').textContent = 'הבסיס: ' + B.length + ' חודשים מלאים, ' + WF.mShort(B[0].m) + ' עד ' + WF.mShort(B[B.length - 1].m) + ', עם המשכורת החדשה. התקרות הן של תוכנית היציאה מהמינוס: נובמבר–דצמבר 2026 ואחר כך 2027.';

  var avgInc = WF.avg(B.map(function (m) { return m.inc; })), avgExp = WF.avg(B.map(function (m) { return m.exp; }));
  function k(t, v, sub, cls) { return '<div class="kpi2"><div class="k">' + t + '</div><div class="v ' + (cls || '') + '">' + v + '</div><div class="d">' + (sub || '') + '</div></div>'; }
  document.getElementById('kpis').innerHTML =
    k('הכנסה חודשית ממוצעת', WF.k(avgInc), 'בלי כסף חד-פעמי', 'pos') +
    k('הוצאות ממוצעות', WF.k(avgExp), 'כולל נסיעות ובית ספר', 'neg') +
    k('הלוואות', WF.ilsText(avgCat('loans')), 'ארבע הוראות קבע בחודש') +
    k('משכנתא', WF.ilsText(avgCat('mortgage')), 'חיוב חודשי');

  // merchants per category over the base months (the sync keeps the top eight per month)
  var mer = {};
  base.forEach(function (k2) { var d = det[k2]; if (!d) return; d.top.forEach(function (t) { var o = mer[t.cat] = mer[t.cat] || {}; o[t.m] = (o[t.m] || 0) + t.amt / B.length; }); });
  var MERCH = { 'ועד - קיטנות': 'ועד: תשלום בית ספר' };

  var caps = (P.caps || []).filter(function (c) { return c.cat !== 'travel'; });
  var GROUP = ['fixed', 'living', 'flex'], rows = '<tr><th>קטגוריה</th><th class="n">ממוצע בפועל</th><th class="n">תקרה נוב׳–דצמ׳</th><th class="n hs">תקרה 2027</th><th class="n hs">החודש עד היום</th><th>מצב</th></tr>';
  var tot = { avg: 0, p1: 0, p2: 0 }, idx = 0;
  GROUP.forEach(function (g) {
    var list = caps.filter(function (c) { return WF.group(c.cat) === g; }).sort(function (a, b) { return avgCat(b.cat) - avgCat(a.cat); });
    if (!list.length) return;
    var sa = 0, s1 = 0, s2 = 0; list.forEach(function (c) { sa += avgCat(c.cat); s1 += c.p1; s2 += c.p2; });
    rows += '<tr><td colspan="6" style="background:var(--e);font-weight:700;padding:6px 8px">' + WF.GROUPS[g] + ' · ממוצע ' + WF.ilsText(sa) + ' · תקרה 2027 ' + WF.ilsText(s2) + '</td></tr>';
    list.forEach(function (c) {
      var a = avgCat(c.cat), over = a > c.p2 * 1.02, near = !over && a > c.p2 * 0.9;
      tot.avg += a; tot.p1 += c.p1; tot.p2 += c.p2;
      var lab = c.kind === 'fixed' ? '<span class="tag">קבוע</span>' : c.kind === 'result' ? '<span class="tag">תוצאה</span>' : over ? '<span class="tag bad">מעל התקרה ב-' + WF.ilsText(a - c.p2) + '</span>' : near ? '<span class="tag warn">קרוב לתקרה</span>' : '<span class="tag ok">בתקרה</span>';
      var ms = Object.keys(mer[c.cat] || {}).sort(function (x, y) { return mer[c.cat][y] - mer[c.cat][x]; }).slice(0, 6);
      rows += '<tr class="rw" data-i="' + idx + '" style="cursor:pointer"><td><span class="dot" style="background:' + WF.color(c.cat) + '"></span>' + WF.name(c.cat) + (ms.length ? ' <span style="color:var(--m);font-size:.75rem">▾</span>' : '') + '</td><td class="n">' + WF.ilsText(a) + '</td><td class="n">' + WF.ilsText(c.p1) + '</td><td class="n hs">' + WF.ilsText(c.p2) + '</td><td class="n hs">' + WF.ilsText(liveCats[c.cat] || 0) + '</td><td>' + lab + '</td></tr>';
      if (ms.length) rows += '<tr class="dt" id="dt' + idx + '" hidden><td colspan="6" style="background:var(--e);font-size:.82rem;color:var(--m)">' + ms.map(function (m) { return WF.esc(MERCH[m] || m) + ' <b class="num" style="color:var(--t)">' + WF.ilsText(mer[c.cat][m]) + '</b>'; }).join(' · ') + '<br>ממוצע חודשי בארבעת החודשים, מתוך העסקים הגדולים בכל חודש.</td></tr>';
      idx++;
    });
  });
  rows += '<tr style="font-weight:800"><td>סך הכול</td><td class="n">' + WF.ilsText(tot.avg) + '</td><td class="n">' + WF.ilsText(tot.p1) + '</td><td class="n hs">' + WF.ilsText(tot.p2) + '</td><td class="n hs">' + WF.ilsText(live.mtd_expenses || 0) + '</td><td>' + (tot.avg > tot.p2 ? '<span class="tag bad">מעל התקרות ב-' + WF.ilsText(tot.avg - tot.p2) + '</span>' : '<span class="tag ok">בתקרות</span>') + '</td></tr>';
  document.getElementById('tCat').innerHTML = rows;
  Array.prototype.forEach.call(document.querySelectorAll('tr.rw'), function (r) {
    r.onclick = function () { var d = document.getElementById('dt' + r.getAttribute('data-i')); if (d) d.hidden = !d.hidden; };
  });

  // outside the running budget: school payments and the planned trips
  var out = '<table class="tb">', out0 = '';
  var RC = (D.recurring && D.recurring.items) || [];
  var sch = RC.filter(function (i) { return i.id === 'school_cheques'; })[0];
  if (sch) { var paid = WF.sum(Object.keys(sch.m).map(function (x) { return sch.m[x]; })); out0 += '<tr><td><span class="dot" style="background:' + WF.color('school') + '"></span><b>בית ספר, שלושה ילדים</b><div style="font-size:.8rem;color:var(--m)">' + WF.esc(sch.note || '') + '. שולם עד היום ' + WF.ilsText(paid) + ', נשאר ' + WF.ilsText(Math.max(0, sch.yearly - paid)) + '</div></td><td class="n">' + WF.ilsText(sch.yearly) + '</td></tr>'; }
  var camp = RC.filter(function (i) { return i.id === 'camps_vaad'; })[0];
  var campMonths = WF.months().filter(function (m) { return (m.cats.camps || 0) > 0; });
  if (campMonths.length) out0 += '<tr><td><span class="dot" style="background:' + WF.color('camps') + '"></span><b>קייטנות קיץ, שלושה ילדים</b><div style="font-size:.8rem;color:var(--m)">' + WF.ilsText(campMonths[campMonths.length - 1].cats.camps) + ' בחודש ב-' + campMonths.map(function (m) { return WF.mShort(m.m); }).join(', ') + (camp && camp.note ? ' (' + WF.esc(camp.note) + ')' : '') + '</div></td><td class="n">' + WF.ilsText(WF.sum(campMonths.map(function (m) { return m.cats.camps; }))) + '</td></tr>';
  out += out0;
  (P.trips || []).forEach(function (t) { out += '<tr><td><span class="dot" style="background:' + WF.color('travel') + '"></span><b>' + WF.esc(t.name) + '</b> · ' + WF.mShort(t.month) + (t.note ? '<div style="font-size:.8rem;color:var(--m)">' + WF.esc(t.note) + '</div>' : '') + '</td><td class="n">' + WF.ilsText(t.amt) + (t.est ? ' <span class="tag">הערכה</span>' : '') + '</td></tr>'; });
  document.getElementById('out').innerHTML = out + '</table>';

  document.getElementById('rules').innerHTML = (P.rules || []).map(function (r) { return '<li><b>' + WF.esc(r.t) + '</b><div style="color:var(--m);font-size:.88rem">' + WF.esc(r.d) + '</div></li>'; }).join('');
  document.getElementById('notes').innerHTML = '<b>מה בעמוד:</b> הכול נשלף מהנתונים, בלי מספרים קבועים בקוד. "ממוצע בפועל" הוא ממוצע ארבעת חודשי הבסיס; התקרות הן של תוכנית היציאה מהמינוס. הוצאות קבועות (משכנתא, הלוואות, חשבונות, ביטוחים) מוצגות כדי לראות את התמונה המלאה, והתקציב השבועי בעמוד "שבוע" מתייחס רק למחיה השוטפת ולגמישות.';
});
</script>
</body>
</html>
