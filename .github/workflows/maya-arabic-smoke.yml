name: Maya Arabic smoke test

on:
  pull_request:
    paths:
      - 'maya-arabic/**'
      - 'tests/maya-arabic.smoke.js'
      - '.github/workflows/maya-arabic-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'maya-arabic/**'
      - 'tests/maya-arabic.smoke.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        run: node tests/maya-arabic.smoke.js
